[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-flooding-thesis"
version = "0.1.0"
description = "Format-aware decoy file generation and plausibility evaluation for data flooding experiments."
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numba",
    "numpy",
    "pandas",
    "python-docx",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
analysis = ["magika"]

[tool.setuptools.packages.find]
where = ["src"]
